[package]
name         = "shellfn-attribute"
version      = "0.2.1"
authors      = ["Marcin Sas-Szymanski <synek317@gmail.com>"]
description  = "Attribute macro for `shellfn` crate"
license      = "MIT"
edition      = "2024"
rust-version = "1.88.0"

[lib]
doctest    = false
proc-macro = true
path       = "src/lib.rs"

[dependencies]
syn          = { version = "3", features = ["full", "extra-traits"] }
quote        = "1"
proc-macro2  = "1"
darling      = "0.24"
shellwords   = "1"
shellfn-core = { path = "../shellfn-core", version = "0.2.1" }
